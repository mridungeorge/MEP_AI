[project]
name = "mep-copilot"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["pint>=0.24", "pyyaml>=6", "jsonschema>=4.21", "pydantic>=2", "fastapi>=0.110", "reportlab>=4",
                "ifcopenshell>=0.8", "ezdxf>=1.3", "openpyxl>=3.1", "python-multipart>=0.0.9", "psycopg[binary]>=3.2", "pyjwt>=2.8",
                "uvicorn>=0.29"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "types-pyyaml", "types-jsonschema", "psycopg[binary]>=3.2", "pypdf>=5", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/mep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["apps/api/mep/engine", "apps/api/mep/diff", "apps/api/mep/review"]
strict = true

[[tool.mypy.overrides]]
module = ["reportlab.*", "ifcopenshell.*", "ezdxf.*", "openpyxl.*"]
ignore_missing_imports = true
