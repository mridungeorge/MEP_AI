id: sketchup
# verified = checked against the public fixtures listed below, which are real exports from this program
status: verified
verified_against:
  - tests/fixtures/ifc/bsi-arch-ifc2x3.ifc
  - tests/fixtures/ifc/bsi-arch-ifc4.ifc
match:
  originating_system: ['(?i)sketchup']
area:
  quantities: [[Qto_SpaceBaseQuantities, NetFloorArea], [Qto_SpaceBaseQuantities, GrossFloorArea]]
  geometry_fallback: true
use:
  properties: [[Pset_SpaceCommon, OccupancyType], [Pset_SpaceCommon, Category]]
  object_type_fallback: true
ceiling_void:
  properties: []
known_issues:
  - Exports no area quantities for spaces; the area is computed from the space geometry (footprint), not read.
