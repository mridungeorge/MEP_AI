    not name climate zones. CZ8 is marked UNREADABLE because it is absent from the table, so the CZ8 limit
    without gas is unresolved. Band edges are "<= 500 m2" and "> 500 m2". (1)(f) allows any combination
    of (a)-(e). (2) is the bathroom allowance for Class 2, 3, 9a or 9c buildings at 1.2 kW with a timer.
    The guide corroborates (1)(e)(i), (1)(e)(i)(C), (1)(e)(ii) and (1)(e)(iii). The J6D3(1)(b)(iii) reheat
