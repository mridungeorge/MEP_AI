    unit: minutes
    clause_or_table: J6D10(2)(b)
    letter_inferred: true
  notes: 'The 2025 table header is "Maximum electric resistance heating capacity". The clause now applies
    Table J6D10 to CZ 3 to 8 regardless of gas availability; the 2022 "reticulated gas not available"
    condition is gone. CZ1 and CZ2 share 40 W/m2; 2022 had CZ1 = 10 W/m2. The table has columns for CZ
    3 to 7 only, with no CZ8 column (confirmed in raw HTML), even though the clause cites CZ 3 to 8. The
    CZ8 limit is therefore UNREADABLE and needs engineer resolution. (1)(c) now adds the 4-pipe chiller
    alongside the heat pump. (1)(e)(iii) points to J6D3(1)(c)(iv), zone-level reheat no more than 7.5°C
    at any intended airflow. (1)(f) allows any combination. (2) is the bathroom heater allowance with
    no building-class restriction in 2025. Related but out of scope: (5)(a)(i) reserved electrical capacity
    references the (1)(e)(i)/(ii) limits; (5)(a)(ii) assumes nominal COP 3.25. The QLD variation blanks
    (5), (6) and (7). The 2025 page has no NSW J6D10 variation.

    '
