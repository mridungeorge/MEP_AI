    unit: L/s
    clause_or_table: J6D7
    letter_inferred: false
  - name: ac_system_capacity_trigger_comparison
    value: '>= (3000 L/s or greater)'
    unit: n/a
    clause_or_table: J6D7
    letter_inferred: false
  notes: 'Single-paragraph clause with no subclauses. Ductwork in the single or final room served is
    excluded (non-numeric). Sealing must follow AS 4254.1 and AS 4254.2 for the system static pressure.
    No numeric leakage limit is on the NCC page; any limit comes from AS 4254, which needs licensed text.
    The guide refers to a leakage test clause in AS 4254.2.

    '
