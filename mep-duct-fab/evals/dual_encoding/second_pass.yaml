# Independent second-pass threshold extraction (dual encoding).
# Source: official ABCB NCC online pages only, fetched with curl on 2026-10-06.
# Extracted without reference to rules/, docs/ or git history.
# Values, units and clause references only. No standards wording reproduced.
#
# Edition verification: both pages carry <link rel="canonical"> pointing to the
# requested edition URL (ncc-2022 / ncc-2025). The breadcrumb element is empty in
# the static HTML, but the rendered breadcrumb text on the 2025 page reads
# "National Construction Code 2025 > NCC 2025 Volume One".
#
# letter_inferred: the HTML renders sub-clause lists as <ol> without printed
# letters/numerals. Letters below are inferred from item order. Where the
# 2022 guide commentary on the same page names the letter, that corroboration
# is noted. Subclause numbers (1), (2)... are printed in the HTML (<num>), so
# those are not inferred.
#
# Units: the unit is given exactly as printed. "kWr" is printed as plain text
# "kWr"; "kWheating" is printed as kW with subscript "heating". R-Values are
# printed with no unit on the page.

NCC2022-J6D3-econ-cycle:
  source_url: https://ncc.abcb.gov.au/editions/ncc-2022/adopted/volume-one/j-energy-efficiency/part-j6-air-conditioning-and-ventilation
  edition_verified: true
  thresholds:
  - name: economy_cycle_trigger_airflow_cz2
    value: 9000
    unit: L/s
    clause_or_table: Table J6D3
    letter_inferred: false
  - name: economy_cycle_trigger_airflow_cz3
    value: 7500
    unit: L/s
    clause_or_table: Table J6D3
    letter_inferred: false
  - name: economy_cycle_trigger_airflow_cz4
    value: 3500
    unit: L/s
    clause_or_table: Table J6D3
    letter_inferred: false
  - name: economy_cycle_trigger_airflow_cz5
    value: 3000
    unit: L/s
    clause_or_table: Table J6D3
    letter_inferred: false
  - name: economy_cycle_trigger_airflow_cz6
    value: 2000
    unit: L/s
    clause_or_table: Table J6D3
    letter_inferred: false
  - name: economy_cycle_trigger_airflow_cz7
    value: 2500
    unit: L/s
    clause_or_table: Table J6D3
    letter_inferred: false
  - name: economy_cycle_trigger_airflow_cz8
    value: 4000
    unit: L/s
    clause_or_table: Table J6D3
    letter_inferred: false
  - name: trigger_comparison
    value: '>= (greater than or equal to table value)'
    unit: n/a
    clause_or_table: J6D3(1)(c)
    letter_inferred: true
  - name: exempt_climate_zone
    value: 1
    unit: climate zone
    clause_or_table: J6D3(1)(c)
    letter_inferred: true
  notes: 'The airflow compared is that of a single airside component of the system. The guide says this
    means each air-conditioner serving a space, not the sum of units. The requirement applies only to
    a system that provides the required mechanical ventilation. Exemptions are climate zone 1 (no row
    in the table) and cases where dehumidification control is needed (no numeric criterion). The letter
    (c) is corroborated by the guide commentary on the same page. CZ6 = 2000 L/s and CZ8 = 4000 L/s here;
    both differ from NCC 2025.

    '
NCC2022-J6D3-ac-time-switch:
  source_url: https://ncc.abcb.gov.au/editions/ncc-2022/adopted/volume-one/j-energy-efficiency/part-j6-air-conditioning-and-ventilation
  edition_verified: true
  thresholds:
  - name: ac_system_capacity_trigger
    value: 2
    unit: kWr
    clause_or_table: J6D3(3)(a)(i)
    letter_inferred: true
  - name: ac_system_capacity_trigger_comparison
    value: '> (more than)'
    unit: n/a
    clause_or_table: J6D3(3)(a)(i)
    letter_inferred: true
  - name: heater_capacity_trigger
    value: 1
    unit: kW (subscript heating)
    clause_or_table: J6D3(3)(a)(ii)
    letter_inferred: true
  - name: heater_capacity_trigger_comparison
    value: '> (more than)'
    unit: n/a
    clause_or_table: J6D3(3)(a)(ii)
    letter_inferred: true
  - name: exempt_continuous_use_hours
    value: 24
    unit: hour
    clause_or_table: J6D3(3)(c)(ii)
    letter_inferred: true
  notes: 'The time switch capability in (3)(b) is qualitative: on/off at variable pre-programmed times
    and days. NCC 2022 has no public-holiday or override numeric requirement. Exemptions (3)(c)(i) are
    non-numeric: (A) a system serving only one SOU in a Class 2, 3 or 9c building; (B) a Class 4 part
    of a building. The guide corroborates (3)(a) and (3)(c). The guide paraphrases the trigger as "capacity
    greater than 2 kW" without the r suffix, but the clause prints kWr.

    '
