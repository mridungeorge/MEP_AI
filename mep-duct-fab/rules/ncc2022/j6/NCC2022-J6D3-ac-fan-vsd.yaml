id: NCC2022-J6D3-ac-fan-vsd
source:
  document: NCC 2022 Volume One
  edition: '2022'
  clause: J6D3(1)(e)
  url: https://ncc.abcb.gov.au/editions/ncc-2022/adopted/volume-one/j-energy-efficiency/part-j6-air-conditioning-and-ventilation
applies_when:
  edition: NCC2022
  state:
  - ALL
  system_type: air_conditioning
  exempt_when:
  - electricity_network_substation == True
  - supply_air_quantity_variable == False
inputs:
- name: supply_airflow
  unit: L/s
  type: number
  provenance: engineer_confirmed
- name: supply_air_quantity_variable
  type: bool
  provenance: engineer_confirmed
- name: variable_speed_fan
  type: bool
  provenance: engineer_confirmed
- name: electricity_network_substation
  type: bool
  provenance: engineer_confirmed
- name: system_type
  type: enum
  provenance: engineer_confirmed
  values:
  - air_conditioning
  - air_conditioning_heating
  - mechanical_ventilation
  - exhaust
threshold:
  table: J6D3(1)(e) clause value
  values:
    ac_system:
      value: 1000
      unit: L/s
check: supply_airflow <= threshold('ac_system') or variable_speed_fan == True
outcomes:
  'true': PASS
  'false': FAIL
  missing_input: NEEDS_JUDGEMENT
near_miss: 0.05
fix_hypotheses:
- 'Hypothesis: verify - fit an EC motor or VSD to the supply fan so supply air quantity is varied by fan speed, not dampers'
depends_on:
- systems.supply_airflow
- systems.supply_air_quantity_variable
- systems.variable_speed_fan
- project.electricity_network_substation
- systems.system_type
tests:
- name: small_vav_no_vsd
  inputs:
    supply_airflow: 900
    supply_air_quantity_variable: true
    variable_speed_fan: false
    electricity_network_substation: false
    system_type: air_conditioning
  expect: PASS
- name: boundary_exactly_1000_no_vsd
  inputs:
    supply_airflow: 1000
    supply_air_quantity_variable: true
    variable_speed_fan: false
    electricity_network_substation: false
    system_type: air_conditioning
  expect: PASS
- name: large_vav_no_vsd
  inputs:
    supply_airflow: 4000
    supply_air_quantity_variable: true
    variable_speed_fan: false
    electricity_network_substation: false
    system_type: air_conditioning
  expect: FAIL
- name: large_vav_with_vsd
  inputs:
    supply_airflow: 4000
    supply_air_quantity_variable: true
    variable_speed_fan: true
    electricity_network_substation: false
    system_type: air_conditioning
  expect: PASS
- name: constant_volume_not_applicable
  inputs:
    supply_airflow: 4000
    supply_air_quantity_variable: false
    variable_speed_fan: false
    electricity_network_substation: false
    system_type: air_conditioning
  expect: NOT_APPLICABLE
- name: missing_vsd_flag
  inputs:
    supply_airflow: 4000
    supply_air_quantity_variable: true
    electricity_network_substation: false
    system_type: air_conditioning
  expect: NEEDS_JUDGEMENT
- name: exempt_electricity_network_substation_true
  inputs:
    supply_airflow: 900
    supply_air_quantity_variable: true
    variable_speed_fan: false
    electricity_network_substation: true
    system_type: air_conditioning
  expect: NOT_APPLICABLE
notes: 1000 L/s typed from ABCB clause text; trigger is strictly more than. The ABCB Guide says a unitary air-conditioning system is exempt from (1)(e), but the clause text has no such exemption, so it is not encoded. Engineer to decide. Overlaps J6D4(1)(c) for ventilation forming part of an AC system.
reviewed_by: null
reviewed_on: null
status: draft
