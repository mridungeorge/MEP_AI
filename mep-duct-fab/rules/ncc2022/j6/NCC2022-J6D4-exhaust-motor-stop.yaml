id: NCC2022-J6D4-exhaust-motor-stop
source:
  document: NCC 2022 Volume One
  edition: '2022'
  clause: J6D4(2)
  url: https://ncc.abcb.gov.au/editions/ncc-2022/adopted/volume-one/j-energy-efficiency/part-j6-air-conditioning-and-ventilation
applies_when:
  edition: NCC2022
  state:
  - ALL
  system_type: exhaust
  exempt_when:
  - electricity_network_substation == True
  - exhaust_in_sou_class_2_3_9c == True
inputs:
- name: exhaust_airflow
  unit: L/s
  type: number
  provenance: engineer_confirmed
- name: can_stop_motor_when_not_needed
  type: bool
  provenance: engineer_confirmed
- name: exhaust_in_sou_class_2_3_9c
  type: bool
  provenance: engineer_confirmed
- name: electricity_network_substation
  type: bool
  provenance: engineer_confirmed
- name: system_type
  type: enum
  provenance: engineer_confirmed
  values:
  - air_conditioning
  - air_conditioning_heating
  - mechanical_ventilation
  - exhaust
threshold:
  table: J6D4(2) clause value
  values:
    exhaust_system:
      value: 1000
      unit: L/s
check: exhaust_airflow <= threshold('exhaust_system') or can_stop_motor_when_not_needed == True
outcomes:
  'true': PASS
  'false': FAIL
  missing_input: NEEDS_JUDGEMENT
near_miss: 0.05
fix_hypotheses:
- 'Hypothesis: verify - add a control (time switch, interlock, occupancy or process signal) that lets the exhaust fan motor be stopped when ventilation is not required'
- 'Hypothesis: verify - if the exhaust must run to balance required outdoor air or for safety, consider a Performance Solution'
depends_on:
- systems.exhaust_airflow
- systems.controls.can_stop_motor_when_not_needed
- systems.exhaust_in_sou_class_2_3_9c
- project.electricity_network_substation
- systems.system_type
tests:
- name: small_exhaust_no_stop
  inputs:
    exhaust_airflow: 600
    can_stop_motor_when_not_needed: false
    exhaust_in_sou_class_2_3_9c: false
    electricity_network_substation: false
    system_type: exhaust
  expect: PASS
- name: boundary_exactly_1000_no_stop
  inputs:
    exhaust_airflow: 1000
    can_stop_motor_when_not_needed: false
    exhaust_in_sou_class_2_3_9c: false
    electricity_network_substation: false
    system_type: exhaust
  expect: PASS
- name: large_exhaust_no_stop
  inputs:
    exhaust_airflow: 1500
    can_stop_motor_when_not_needed: false
    exhaust_in_sou_class_2_3_9c: false
    electricity_network_substation: false
    system_type: exhaust
  expect: FAIL
- name: large_exhaust_with_stop
  inputs:
    exhaust_airflow: 1500
    can_stop_motor_when_not_needed: true
    exhaust_in_sou_class_2_3_9c: false
    electricity_network_substation: false
    system_type: exhaust
  expect: PASS
- name: sou_exempt
  inputs:
    exhaust_airflow: 1500
    can_stop_motor_when_not_needed: false
    exhaust_in_sou_class_2_3_9c: true
    electricity_network_substation: false
    system_type: exhaust
  expect: NOT_APPLICABLE
- name: substation_excluded
  inputs:
    exhaust_airflow: 1500
    can_stop_motor_when_not_needed: false
    exhaust_in_sou_class_2_3_9c: false
    electricity_network_substation: true
    system_type: exhaust
  expect: NOT_APPLICABLE
- name: missing_airflow
  inputs:
    can_stop_motor_when_not_needed: false
    exhaust_in_sou_class_2_3_9c: false
    electricity_network_substation: false
    system_type: exhaust
  expect: NEEDS_JUDGEMENT
notes: 1000 L/s typed from ABCB clause text; trigger is strictly more than. Clause exception is only exhaust in a SOU of Class 2/3/9c; Class 4 parts are not exempt from (2). The Guide mentions exhaust balancing required outdoor air, but that is not in the clause text and is not encoded. Carpark exhaust is J6D4(3), out of scope.
reviewed_by: null
reviewed_on: null
status: draft
