notes: 'Values typed from ABCB J6D10(1)(e) and Table J6D10. Table J6D10 has CZ3-7 columns only, applies only without reticulated gas at the boundary. (e)(ii) is CZ1-5 only. Check relies on short-circuit and/or. TAS: Class 2/4 Section J is BCA 2019 (excluded here anyway). NT has its own Part J6 variation, not reviewed.'
