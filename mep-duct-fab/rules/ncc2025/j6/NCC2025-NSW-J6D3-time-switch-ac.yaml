id: NCC2025-NSW-J6D3-time-switch-ac
source:
  document: NCC 2025 Volume One (NSW variation)
  edition: '2025'
  clause: J6D3(3), J6D3(4), NSW J6D3(5)
  url: https://ncc.abcb.gov.au/editions/ncc-2025/adopted/volume-one/j-energy-efficiency/part-j6-air-conditioning-and-ventilation
applies_when:
  edition: NCC2025
  state:
  - NSW
  building_class:
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  - 7a
  - 7b
  - '8'
  - 9a
  - 9b
  - 9c
  system_type: air_conditioning
  exempt_when:
  - serves_only_one_sou_class_3_or_9c == True
  - continuous_24h_use == True
  - is_electricity_substation == True
inputs:
- name: ac_refrigeration_capacity
  unit: kW
  type: number
  provenance: engineer_confirmed
- name: ac_heater_capacity
  unit: kW
  type: number
  provenance: engineer_confirmed
- name: time_switch_provided
  type: bool
  provenance: engineer_confirmed
- name: time_switch_programmable_times_and_days
  type: bool
  provenance: engineer_confirmed
- name: time_switch_holidays_1yr_ahead
  type: bool
  provenance: engineer_confirmed
- name: time_switch_override_demand_or_manual
  type: bool
  provenance: engineer_confirmed
- name: time_switch_override_resume_period
  unit: h
  type: number
  provenance: engineer_confirmed
- name: serves_only_one_sou_class_3_or_9c
  type: bool
  provenance: engineer_confirmed
- name: continuous_24h_use
  type: bool
  provenance: engineer_confirmed
- name: system_type
  type: enum
  provenance: engineer_confirmed
  values:
  - air_conditioning
  - air_conditioning_heating
  - mechanical_ventilation
  - exhaust
- name: is_electricity_substation
  type: bool
  provenance: engineer_confirmed
- name: building_class
  type: string
  provenance: engineer_confirmed
  values:
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  - 7a
  - 7b
  - '8'
  - 9a
  - 9b
  - 9c
threshold:
  values:
    ac_trigger:
      value: 2
      unit: kW
    heater_trigger:
      value: 1
      unit: kW
    max_override_resume:
      value: 2
      unit: h
check: (ac_refrigeration_capacity <= threshold('ac_trigger') and ac_heater_capacity <= threshold('heater_trigger')) or (time_switch_provided == True and time_switch_programmable_times_and_days == True and time_switch_holidays_1yr_ahead == True and time_switch_override_demand_or_manual == True and time_switch_override_resume_period <= threshold('max_override_resume'))
outcomes:
  'true': PASS
  'false': FAIL
  missing_input: NEEDS_JUDGEMENT
near_miss: 0.05
fix_hypotheses:
- 'Hypothesis: verify. Provide a 7-day programmable time switch (or BMS schedule) with public-holiday programming at least 1 year ahead.'
- 'Hypothesis: verify. Add a demand-operated or manual override that reverts to normal operation within 2 hours.'
depends_on:
- systems.ac_refrigeration_capacity
- systems.ac_heater_capacity
- systems.time_switch_provided
- systems.time_switch_programmable_times_and_days
- systems.time_switch_holidays_1yr_ahead
- systems.time_switch_override_demand_or_manual
- systems.time_switch_override_resume_period
- systems.serves_only_one_sou_class_3_or_9c
- spaces.continuous_24h_use
- systems.system_type
- project.is_electricity_substation
- project.building_class
tests:
- name: compliant_time_switch
  inputs:
    ac_refrigeration_capacity: 10
    ac_heater_capacity: 0
    time_switch_provided: true
    time_switch_programmable_times_and_days: true
    time_switch_holidays_1yr_ahead: true
    time_switch_override_demand_or_manual: true
    time_switch_override_resume_period: 1
    serves_only_one_sou_class_3_or_9c: false
    continuous_24h_use: false
    system_type: air_conditioning
    is_electricity_substation: false
    building_class: '5'
  expect: PASS
- name: class_4_part_no_switch_fails_in_nsw
  inputs:
    ac_refrigeration_capacity: 10
    ac_heater_capacity: 0
    time_switch_provided: false
    time_switch_programmable_times_and_days: false
    time_switch_holidays_1yr_ahead: false
    time_switch_override_demand_or_manual: false
    time_switch_override_resume_period: 0
    serves_only_one_sou_class_3_or_9c: false
    continuous_24h_use: false
    system_type: air_conditioning
    is_electricity_substation: false
    building_class: '5'
  expect: FAIL
- name: boundary_2kWr_no_switch
  inputs:
    ac_refrigeration_capacity: 2
    ac_heater_capacity: 0
    time_switch_provided: false
    time_switch_programmable_times_and_days: false
    time_switch_holidays_1yr_ahead: false
    time_switch_override_demand_or_manual: false
    time_switch_override_resume_period: 0
    serves_only_one_sou_class_3_or_9c: false
    continuous_24h_use: false
    system_type: air_conditioning
    is_electricity_substation: false
    building_class: '5'
  expect: PASS
- name: sou_class_3_exempt
  inputs:
    ac_refrigeration_capacity: 10
    ac_heater_capacity: 0
    time_switch_provided: false
    serves_only_one_sou_class_3_or_9c: true
    continuous_24h_use: false
    system_type: air_conditioning
    is_electricity_substation: false
    building_class: '5'
  expect: NOT_APPLICABLE
- name: missing_switch_details
  inputs:
    ac_refrigeration_capacity: 10
    ac_heater_capacity: 0
    serves_only_one_sou_class_3_or_9c: false
    continuous_24h_use: false
    system_type: air_conditioning
    is_electricity_substation: false
    building_class: '5'
  expect: NEEDS_JUDGEMENT
- name: exempt_continuous_24h_use_true
  inputs:
    ac_refrigeration_capacity: 10
    ac_heater_capacity: 0
    time_switch_provided: true
    time_switch_programmable_times_and_days: true
    time_switch_holidays_1yr_ahead: true
    time_switch_override_demand_or_manual: true
    time_switch_override_resume_period: 1
    serves_only_one_sou_class_3_or_9c: false
    continuous_24h_use: true
    system_type: air_conditioning
    is_electricity_substation: false
    building_class: '5'
  expect: NOT_APPLICABLE
- name: exempt_is_electricity_substation_true
  inputs:
    ac_refrigeration_capacity: 10
    ac_heater_capacity: 0
    time_switch_provided: true
    time_switch_programmable_times_and_days: true
    time_switch_holidays_1yr_ahead: true
    time_switch_override_demand_or_manual: true
    time_switch_override_resume_period: 1
    serves_only_one_sou_class_3_or_9c: false
    continuous_24h_use: false
    system_type: air_conditioning
    is_electricity_substation: true
    building_class: '5'
  expect: NOT_APPLICABLE
notes: NSW state variation of the J6D3 time switch requirement, encoded from the NSW J6D3(5) replacement shown on the ABCB NCC 2025 page. Same logic as NCC2025-J6D3-time-switch-ac except the Class 4 part exemption is absent. Class 2 SOU is not exempt in the 2025 text. Engineer to confirm the current NSW adoption status of NCC 2025 Section J.
reviewed_by: null
reviewed_on: null
status: draft
