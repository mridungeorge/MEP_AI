- name: exempt_fan_part_of_ac_or_mv_system_false
  inputs:
    fan_input_power: 2200
    fan_variable_speed_capable: true
    fan_part_of_ac_or_mv_system: false
    fan_explosion_proof: false
    fan_is_supply_fan_in_unitary_ac: false
    fan_in_unducted_ac_system: false
    fan_dedicated_fire_smoke_control: false
    fan_is_kitchen_exhaust: false
    fan_is_process_related: false
    fan_system_level_path_claimed: false
    is_electricity_substation: false
    building_class: '5'
  expect: NOT_APPLICABLE
- name: needs_fan_is_process_related_true
  inputs:
    fan_input_power: 2200
    fan_variable_speed_capable: true
    fan_part_of_ac_or_mv_system: true
    fan_explosion_proof: false
    fan_is_supply_fan_in_unitary_ac: false
    fan_in_unducted_ac_system: false
    fan_dedicated_fire_smoke_control: false
    fan_is_kitchen_exhaust: false
    fan_is_process_related: true
    fan_system_level_path_claimed: false
    is_electricity_substation: false
    building_class: '5'
  expect: NEEDS_JUDGEMENT
notes: Encoded from ABCB NCC 2025 J6D5(5)(a), (6)(a)-(c), (12)(a)-(d). Trigger is strictly greater than 750 W. Only (5)(a) is encoded; (5)(b) and (c) (reduced flow, variable volume/pressure) need separate rules. J6D5(1)(b) whole-system path gives NEEDS_JUDGEMENT, not FAIL. Unducted exemption airflow is the AC system supply air capacity, strictly below 1000 L/s.
