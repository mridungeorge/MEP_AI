id: NCC2025-J6D3-econ-cycle
source:
  document: NCC 2025 Volume One
  edition: '2025'
  clause: J6D3(1)(d), Table J6D3
  url: https://ncc.abcb.gov.au/editions/ncc-2025/adopted/volume-one/j-energy-efficiency/part-j6-air-conditioning-and-ventilation
applies_when:
  edition: NCC2025
  state:
  - ALL
  building_class:
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  - 7a
  - 7b
  - '8'
  - 9a
  - 9b
  - 9c
  climate_zone:
    not_in:
    - 1
  system_type: air_conditioning
  exempt_when:
  - is_electricity_substation == True
  - provides_required_mech_ventilation == False
  - dehumidification_control_needed == True
inputs:
- name: max_airside_component_airflow
  unit: L/s
  type: number
  provenance: engineer_confirmed
- name: climate_zone
  type: int
  provenance: address_lookup_confirmed
- name: economy_cycle
  type: bool
  provenance: engineer_confirmed
- name: system_type
  type: enum
  provenance: engineer_confirmed
  values:
  - air_conditioning
  - air_conditioning_heating
  - mechanical_ventilation
  - exhaust
- name: provides_required_mech_ventilation
  type: bool
  provenance: engineer_confirmed
- name: dehumidification_control_needed
  type: bool
  provenance: engineer_confirmed
- name: is_electricity_substation
  type: bool
  provenance: engineer_confirmed
- name: building_class
  type: string
  provenance: engineer_confirmed
  values:
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  - 7a
  - 7b
  - '8'
  - 9a
  - 9b
  - 9c
threshold:
  table: J6D3
  values:
    by_climate_zone:
      unit: L/s
      values:
        2: 9000
        3: 7500
        4: 3500
        5: 3000
        6: 1200
        7: 2500
        8: 2000
check: max_airside_component_airflow < threshold('by_climate_zone', climate_zone) or economy_cycle == True
outcomes:
  'true': PASS
  'false': FAIL
  missing_input: NEEDS_JUDGEMENT
near_miss: 0.05
fix_hypotheses:
- 'Hypothesis: verify. Add an outdoor air economy cycle to this air-conditioning system.'
- 'Hypothesis: verify. Confirm whether dehumidification control is genuinely needed for the space; if so the requirement does not apply.'
depends_on:
- systems.max_airside_component_airflow
- systems.economy_cycle
- systems.system_type
- systems.provides_required_mech_ventilation
- spaces.dehumidification_control_needed
- project.climate_zone
- project.is_electricity_substation
- project.building_class
tests:
- name: cz6_below_threshold_no_cycle
  inputs:
    max_airside_component_airflow: 1199
    climate_zone: 6
    economy_cycle: false
    system_type: air_conditioning
    provides_required_mech_ventilation: true
    dehumidification_control_needed: false
    is_electricity_substation: false
    building_class: '5'
  expect: PASS
- name: cz6_boundary_equal_no_cycle
  inputs:
    max_airside_component_airflow: 1200
    climate_zone: 6
    economy_cycle: false
    system_type: air_conditioning
    provides_required_mech_ventilation: true
    dehumidification_control_needed: false
    is_electricity_substation: false
    building_class: '5'
  expect: FAIL
- name: cz6_above_threshold_with_cycle
  inputs:
    max_airside_component_airflow: 5000
    climate_zone: 6
    economy_cycle: true
    system_type: air_conditioning
    provides_required_mech_ventilation: true
    dehumidification_control_needed: false
    is_electricity_substation: false
    building_class: '5'
  expect: PASS
- name: cz8_boundary_equal_no_cycle
  inputs:
    max_airside_component_airflow: 2000
    climate_zone: 8
    economy_cycle: false
    system_type: air_conditioning
    provides_required_mech_ventilation: true
    dehumidification_control_needed: false
    is_electricity_substation: false
    building_class: '5'
  expect: FAIL
- name: cz8_below_threshold_no_cycle
  inputs:
    max_airside_component_airflow: 1999
    climate_zone: 8
    economy_cycle: false
    system_type: air_conditioning
    provides_required_mech_ventilation: true
    dehumidification_control_needed: false
    is_electricity_substation: false
    building_class: '5'
  expect: PASS
- name: cz2_above_threshold_no_cycle
  inputs:
    max_airside_component_airflow: 9000
    climate_zone: 2
    economy_cycle: false
    system_type: air_conditioning
    provides_required_mech_ventilation: true
    dehumidification_control_needed: false
    is_electricity_substation: false
    building_class: '5'
  expect: FAIL
- name: cz1_not_applicable
  inputs:
    max_airside_component_airflow: 99999
    climate_zone: 1
    economy_cycle: false
    system_type: air_conditioning
    provides_required_mech_ventilation: true
    dehumidification_control_needed: false
    is_electricity_substation: false
    building_class: '5'
  expect: NOT_APPLICABLE
- name: dehumidification_needed_not_applicable
  inputs:
    max_airside_component_airflow: 99999
    climate_zone: 6
    economy_cycle: false
    system_type: air_conditioning
    provides_required_mech_ventilation: true
    dehumidification_control_needed: true
    is_electricity_substation: false
    building_class: '5'
  expect: NOT_APPLICABLE
- name: substation_not_applicable
  inputs:
    max_airside_component_airflow: 99999
    climate_zone: 6
    economy_cycle: false
    system_type: air_conditioning
    provides_required_mech_ventilation: true
    dehumidification_control_needed: false
    is_electricity_substation: true
    building_class: '5'
  expect: NOT_APPLICABLE
- name: missing_airflow
  inputs:
    climate_zone: 6
    economy_cycle: false
    system_type: air_conditioning
    provides_required_mech_ventilation: true
    dehumidification_control_needed: false
    is_electricity_substation: false
    building_class: '5'
  expect: NEEDS_JUDGEMENT
- name: exempt_provides_required_mech_ventilation_false
  inputs:
    max_airside_component_airflow: 1199
    climate_zone: 6
    economy_cycle: false
    system_type: air_conditioning
    provides_required_mech_ventilation: false
    dehumidification_control_needed: false
    is_electricity_substation: false
    building_class: '5'
  expect: NOT_APPLICABLE
notes: Encoded from ABCB NCC 2025 J6D3. Letter (d) verified by item order (14 items a-n; (c) is the multi-zone item, confirmed by the explanatory note citing (1)(c)(iii)). Trigger is >= table value. max_airside_component_airflow = the largest total airflow of any single airside component (interpretation; engineer to confirm). Table J6D3 has no CZ1 row by design.
reviewed_by: null
reviewed_on: null
status: draft
