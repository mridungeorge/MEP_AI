id: NCC2022-J6D4-mv-fan-vsd
source:
  document: NCC 2022 Volume One
  edition: '2022'
  clause: J6D4(1)(c)
  url: https://ncc.abcb.gov.au/editions/ncc-2022/adopted/volume-one/j-energy-efficiency/part-j6-air-conditioning-and-ventilation
applies_when:
  edition: NCC2022
  state:
  - ALL
  system_type: mechanical_ventilation
  exempt_when:
  - electricity_network_substation == True
  - serves_single_sou_class_2 == True
  - serves_class_4_part == True
  - f6_requires_constant_downstream_airflow == True
inputs:
- name: mv_airflow
  unit: L/s
  type: number
  provenance: engineer_confirmed
- name: variable_speed_fan
  type: bool
  provenance: engineer_confirmed
- name: f6_requires_constant_downstream_airflow
  type: bool
  provenance: engineer_confirmed
- name: serves_single_sou_class_2
  type: bool
  provenance: engineer_confirmed
- name: serves_class_4_part
  type: bool
  provenance: engineer_confirmed
- name: electricity_network_substation
  type: bool
  provenance: engineer_confirmed
- name: system_type
  type: enum
  provenance: engineer_confirmed
  values:
  - air_conditioning
  - air_conditioning_heating
  - mechanical_ventilation
  - exhaust
threshold:
  table: J6D4(1)(c) clause value
  values:
    mv_system:
      value: 1000
      unit: L/s
check: mv_airflow <= threshold('mv_system') or variable_speed_fan == True
outcomes:
  'true': PASS
  'false': FAIL
  missing_input: NEEDS_JUDGEMENT
near_miss: 0.05
fix_hypotheses:
- 'Hypothesis: verify - fit an EC motor or VSD to the ventilation fan'
- 'Hypothesis: verify - confirm whether Part F6 requires constant downstream airflow for this system (J6D4(1)(c) exception)'
depends_on:
- systems.mv_airflow
- systems.variable_speed_fan
- systems.f6_requires_constant_downstream_airflow
- systems.serves_single_sou_class_2
- systems.serves_class_4_part
- project.electricity_network_substation
- systems.system_type
tests:
- name: small_no_vsd
  inputs:
    mv_airflow: 700
    variable_speed_fan: false
    f6_requires_constant_downstream_airflow: false
    serves_single_sou_class_2: false
    serves_class_4_part: false
    electricity_network_substation: false
    system_type: mechanical_ventilation
  expect: PASS
- name: boundary_exactly_1000_no_vsd
  inputs:
    mv_airflow: 1000
    variable_speed_fan: false
    f6_requires_constant_downstream_airflow: false
    serves_single_sou_class_2: false
    serves_class_4_part: false
    electricity_network_substation: false
    system_type: mechanical_ventilation
  expect: PASS
- name: large_no_vsd
  inputs:
    mv_airflow: 2500
    variable_speed_fan: false
    f6_requires_constant_downstream_airflow: false
    serves_single_sou_class_2: false
    serves_class_4_part: false
    electricity_network_substation: false
    system_type: mechanical_ventilation
  expect: FAIL
- name: large_with_vsd
  inputs:
    mv_airflow: 2500
    variable_speed_fan: true
    f6_requires_constant_downstream_airflow: false
    serves_single_sou_class_2: false
    serves_class_4_part: false
    electricity_network_substation: false
    system_type: mechanical_ventilation
  expect: PASS
- name: f6_constant_flow_exempt
  inputs:
    mv_airflow: 2500
    variable_speed_fan: false
    f6_requires_constant_downstream_airflow: true
    serves_single_sou_class_2: false
    serves_class_4_part: false
    electricity_network_substation: false
    system_type: mechanical_ventilation
  expect: NOT_APPLICABLE
- name: class_2_sou_exempt
  inputs:
    mv_airflow: 2500
    variable_speed_fan: false
    f6_requires_constant_downstream_airflow: false
    serves_single_sou_class_2: true
    serves_class_4_part: false
    electricity_network_substation: false
    system_type: mechanical_ventilation
  expect: NOT_APPLICABLE
- name: class_4_part_exempt
  inputs:
    mv_airflow: 2500
    variable_speed_fan: false
    f6_requires_constant_downstream_airflow: false
    serves_single_sou_class_2: false
    serves_class_4_part: true
    electricity_network_substation: false
    system_type: mechanical_ventilation
  expect: NOT_APPLICABLE
- name: missing_f6_flag
  inputs:
    mv_airflow: 2500
    variable_speed_fan: false
    serves_single_sou_class_2: false
    serves_class_4_part: false
    electricity_network_substation: false
    system_type: mechanical_ventilation
  expect: NEEDS_JUDGEMENT
- name: exempt_electricity_network_substation_true
  inputs:
    mv_airflow: 700
    variable_speed_fan: false
    f6_requires_constant_downstream_airflow: false
    serves_single_sou_class_2: false
    serves_class_4_part: false
    electricity_network_substation: true
    system_type: mechanical_ventilation
  expect: NOT_APPLICABLE
notes: 1000 L/s typed from ABCB clause text; trigger is strictly more than. J6D4(1) general exemption covers only a single SOU in a Class 2 building (not Class 3/9c) or a Class 4 part. Letter (c) confirmed by Guide. Overlaps J6D3(1)(e) where the ventilation is part of an AC system.
reviewed_by: null
reviewed_on: null
status: draft
