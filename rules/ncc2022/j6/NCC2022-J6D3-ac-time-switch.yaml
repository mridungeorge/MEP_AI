id: NCC2022-J6D3-ac-time-switch
source:
  document: NCC 2022 Volume One
  edition: '2022'
  clause: J6D3(3)(a)-(c)
  url: https://ncc.abcb.gov.au/editions/ncc-2022/adopted/volume-one/j-energy-efficiency/part-j6-air-conditioning-and-ventilation
applies_when:
  edition: NCC2022
  state:
  - ALL
  system_type: air_conditioning
  exempt_when:
  - electricity_network_substation == True
  - serves_single_sou_class_2_3_9c == True
  - serves_class_4_part == True
  - needs_24h_continuous_use == True
inputs:
- name: ac_refrigeration_capacity
  unit: kW
  type: number
  provenance: engineer_confirmed
- name: heater_heating_capacity
  unit: kW
  type: number
  provenance: engineer_confirmed
- name: time_switch_provided
  type: bool
  provenance: engineer_confirmed
- name: time_switch_variable_times_and_days
  type: bool
  provenance: engineer_confirmed
- name: serves_single_sou_class_2_3_9c
  type: bool
  provenance: engineer_confirmed
- name: serves_class_4_part
  type: bool
  provenance: engineer_confirmed
- name: needs_24h_continuous_use
  type: bool
  provenance: engineer_confirmed
- name: electricity_network_substation
  type: bool
  provenance: engineer_confirmed
- name: system_type
  type: enum
  provenance: engineer_confirmed
  values:
  - air_conditioning
  - air_conditioning_heating
  - mechanical_ventilation
  - exhaust
threshold:
  table: J6D3(3)(a) clause values
  values:
    ac_system:
      value: 2
      unit: kW
    heater:
      value: 1
      unit: kW
check: (ac_refrigeration_capacity <= threshold('ac_system') and heater_heating_capacity <= threshold('heater')) or (time_switch_provided == True and time_switch_variable_times_and_days == True)
outcomes:
  'true': PASS
  'false': FAIL
  missing_input: NEEDS_JUDGEMENT
near_miss: 0.05
fix_hypotheses:
- 'Hypothesis: verify - add a time switch that can be programmed by time and day'
- 'Hypothesis: verify - confirm whether the space needs 24 hour continuous air-conditioning (J6D3(3)(c) exemption)'
depends_on:
- systems.ac_refrigeration_capacity
- systems.heater_heating_capacity
- systems.controls.time_switch_provided
- systems.controls.time_switch_variable_times_and_days
- systems.serves_single_sou_class_2_3_9c
- systems.serves_class_4_part
- spaces.needs_24h_continuous_use
- project.electricity_network_substation
- systems.system_type
tests:
- name: small_system_no_switch
  inputs:
    ac_refrigeration_capacity: 1.5
    heater_heating_capacity: 0
    time_switch_provided: false
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: false
    needs_24h_continuous_use: false
    electricity_network_substation: false
    system_type: air_conditioning
  expect: PASS
- name: boundary_exactly_2kwr_no_switch
  inputs:
    ac_refrigeration_capacity: 2
    heater_heating_capacity: 1
    time_switch_provided: false
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: false
    needs_24h_continuous_use: false
    electricity_network_substation: false
    system_type: air_conditioning
  expect: PASS
- name: large_ac_no_switch
  inputs:
    ac_refrigeration_capacity: 10
    heater_heating_capacity: 0
    time_switch_provided: false
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: false
    needs_24h_continuous_use: false
    electricity_network_substation: false
    system_type: air_conditioning
  expect: FAIL
- name: heater_over_1kw_no_switch
  inputs:
    ac_refrigeration_capacity: 0
    heater_heating_capacity: 1.1
    time_switch_provided: false
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: false
    needs_24h_continuous_use: false
    electricity_network_substation: false
    system_type: air_conditioning
  expect: FAIL
- name: switch_not_programmable
  inputs:
    ac_refrigeration_capacity: 10
    heater_heating_capacity: 0
    time_switch_provided: true
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: false
    needs_24h_continuous_use: false
    electricity_network_substation: false
    system_type: air_conditioning
  expect: FAIL
- name: large_ac_with_programmable_switch
  inputs:
    ac_refrigeration_capacity: 10
    heater_heating_capacity: 5
    time_switch_provided: true
    time_switch_variable_times_and_days: true
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: false
    needs_24h_continuous_use: false
    electricity_network_substation: false
    system_type: air_conditioning
  expect: PASS
- name: single_sou_exempt
  inputs:
    ac_refrigeration_capacity: 10
    heater_heating_capacity: 0
    time_switch_provided: false
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: true
    serves_class_4_part: false
    needs_24h_continuous_use: false
    electricity_network_substation: false
    system_type: air_conditioning
  expect: NOT_APPLICABLE
- name: class_4_part_exempt
  inputs:
    ac_refrigeration_capacity: 10
    heater_heating_capacity: 0
    time_switch_provided: false
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: true
    needs_24h_continuous_use: false
    electricity_network_substation: false
    system_type: air_conditioning
  expect: NOT_APPLICABLE
- name: continuous_24h_exempt
  inputs:
    ac_refrigeration_capacity: 10
    heater_heating_capacity: 0
    time_switch_provided: false
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: false
    needs_24h_continuous_use: true
    electricity_network_substation: false
    system_type: air_conditioning
  expect: NOT_APPLICABLE
- name: missing_capacity
  inputs:
    heater_heating_capacity: 0
    time_switch_provided: false
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: false
    needs_24h_continuous_use: false
    electricity_network_substation: false
    system_type: air_conditioning
  expect: NEEDS_JUDGEMENT
- name: exempt_electricity_network_substation_true
  inputs:
    ac_refrigeration_capacity: 1.5
    heater_heating_capacity: 0
    time_switch_provided: false
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: false
    needs_24h_continuous_use: false
    electricity_network_substation: true
    system_type: air_conditioning
  expect: NOT_APPLICABLE
notes: 2 kWr and 1 kW heating typed from ABCB clause text; trigger is strictly more than. ac_refrigeration_capacity is kWr (pint has no kWr unit, so kW is used). Exemption letters (c)(i)/(ii) confirmed by Guide reference to J6D3(3)(c). Heater must be one used for air-conditioning.
reviewed_by: null
reviewed_on: null
status: draft
