id: NCC2022-J6D4-mv-time-switch
source:
  document: NCC 2022 Volume One
  edition: '2022'
  clause: J6D4(4)(a)-(c)
  url: https://ncc.abcb.gov.au/editions/ncc-2022/adopted/volume-one/j-energy-efficiency/part-j6-air-conditioning-and-ventilation
applies_when:
  edition: NCC2022
  state:
  - ALL
  system_type: mechanical_ventilation
  exempt_when:
  - electricity_network_substation == True
  - serves_single_sou_class_2_3_9c == True
  - serves_class_4_part == True
  - building_needs_24h_ventilation == True
inputs:
- name: mv_airflow
  unit: L/s
  type: number
  provenance: engineer_confirmed
- name: time_switch_provided
  type: bool
  provenance: engineer_confirmed
- name: time_switch_variable_times_and_days
  type: bool
  provenance: engineer_confirmed
- name: serves_single_sou_class_2_3_9c
  type: bool
  provenance: engineer_confirmed
- name: serves_class_4_part
  type: bool
  provenance: engineer_confirmed
- name: building_needs_24h_ventilation
  type: bool
  provenance: engineer_confirmed
- name: electricity_network_substation
  type: bool
  provenance: engineer_confirmed
- name: system_type
  type: enum
  provenance: engineer_confirmed
  values:
  - air_conditioning
  - air_conditioning_heating
  - mechanical_ventilation
  - exhaust
threshold:
  table: J6D4(4)(a) clause value
  values:
    mv_system:
      value: 1000
      unit: L/s
check: mv_airflow <= threshold('mv_system') or (time_switch_provided == True and time_switch_variable_times_and_days == True)
outcomes:
  'true': PASS
  'false': FAIL
  missing_input: NEEDS_JUDGEMENT
near_miss: 0.05
fix_hypotheses:
- 'Hypothesis: verify - add a time switch that can be programmed by time and day'
- 'Hypothesis: verify - confirm whether the building needs mechanical ventilation for 24 hour occupancy (J6D4(4)(c) exemption)'
depends_on:
- systems.mv_airflow
- systems.controls.time_switch_provided
- systems.controls.time_switch_variable_times_and_days
- systems.serves_single_sou_class_2_3_9c
- systems.serves_class_4_part
- project.building_needs_24h_ventilation
- project.electricity_network_substation
- systems.system_type
tests:
- name: small_system_no_switch
  inputs:
    mv_airflow: 800
    time_switch_provided: false
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: false
    building_needs_24h_ventilation: false
    electricity_network_substation: false
    system_type: mechanical_ventilation
  expect: PASS
- name: boundary_exactly_1000_no_switch
  inputs:
    mv_airflow: 1000
    time_switch_provided: false
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: false
    building_needs_24h_ventilation: false
    electricity_network_substation: false
    system_type: mechanical_ventilation
  expect: PASS
- name: just_over_1000_no_switch
  inputs:
    mv_airflow: 1001
    time_switch_provided: false
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: false
    building_needs_24h_ventilation: false
    electricity_network_substation: false
    system_type: mechanical_ventilation
  expect: FAIL
- name: switch_not_programmable
  inputs:
    mv_airflow: 3000
    time_switch_provided: true
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: false
    building_needs_24h_ventilation: false
    electricity_network_substation: false
    system_type: mechanical_ventilation
  expect: FAIL
- name: large_with_programmable_switch
  inputs:
    mv_airflow: 3000
    time_switch_provided: true
    time_switch_variable_times_and_days: true
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: false
    building_needs_24h_ventilation: false
    electricity_network_substation: false
    system_type: mechanical_ventilation
  expect: PASS
- name: single_sou_exempt
  inputs:
    mv_airflow: 3000
    time_switch_provided: false
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: true
    serves_class_4_part: false
    building_needs_24h_ventilation: false
    electricity_network_substation: false
    system_type: mechanical_ventilation
  expect: NOT_APPLICABLE
- name: class_4_part_exempt
  inputs:
    mv_airflow: 3000
    time_switch_provided: false
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: true
    building_needs_24h_ventilation: false
    electricity_network_substation: false
    system_type: mechanical_ventilation
  expect: NOT_APPLICABLE
- name: building_24h_exempt
  inputs:
    mv_airflow: 3000
    time_switch_provided: false
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: false
    building_needs_24h_ventilation: true
    electricity_network_substation: false
    system_type: mechanical_ventilation
  expect: NOT_APPLICABLE
- name: missing_airflow
  inputs:
    time_switch_provided: false
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: false
    building_needs_24h_ventilation: false
    electricity_network_substation: false
    system_type: mechanical_ventilation
  expect: NEEDS_JUDGEMENT
- name: exempt_electricity_network_substation_true
  inputs:
    mv_airflow: 800
    time_switch_provided: false
    time_switch_variable_times_and_days: false
    serves_single_sou_class_2_3_9c: false
    serves_class_4_part: false
    building_needs_24h_ventilation: false
    electricity_network_substation: true
    system_type: mechanical_ventilation
  expect: NOT_APPLICABLE
notes: 1000 L/s typed from ABCB clause text; trigger is strictly more than. The J6D4(1) general exemption is textually scoped to subclause (1) only, but J6D4(4)(c) separately exempts single SOU in Class 2/3/9c and Class 4 parts, so the outcome is the same. 24h exemption is building-level. Letters (c)(i)/(ii) confirmed by Guide.
reviewed_by: null
reviewed_on: null
status: draft
