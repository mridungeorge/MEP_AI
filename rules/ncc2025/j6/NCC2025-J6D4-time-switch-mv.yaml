id: NCC2025-J6D4-time-switch-mv
source:
  document: NCC 2025 Volume One
  edition: '2025'
  clause: J6D4(4), J6D4(5), J6D4(6), J6D4(7)
  url: https://ncc.abcb.gov.au/editions/ncc-2025/adopted/volume-one/j-energy-efficiency/part-j6-air-conditioning-and-ventilation
applies_when:
  edition: NCC2025
  state:
  - ACT
  - QLD
  - SA
  - TAS
  - VIC
  - WA
  building_class:
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  - 7a
  - 7b
  - '8'
  - 9a
  - 9b
  - 9c
  system_type: mechanical_ventilation
  exempt_when:
  - serves_only_one_sou_class_3_or_9c == True
  - serves_only_class_4_part == True
  - building_needs_24h_mv_occupancy == True
  - is_carpark_exhaust == True
  - required_24_7_contaminant_or_pressurisation == True
  - is_electricity_substation == True
inputs:
- name: mv_airflow
  unit: L/s
  type: number
  provenance: engineer_confirmed
- name: time_switch_provided
  type: bool
  provenance: engineer_confirmed
- name: time_switch_programmable_times_and_days
  type: bool
  provenance: engineer_confirmed
- name: time_switch_holidays_1yr_ahead
  type: bool
  provenance: engineer_confirmed
- name: time_switch_override_demand_or_manual
  type: bool
  provenance: engineer_confirmed
- name: time_switch_override_resume_period
  unit: h
  type: number
  provenance: engineer_confirmed
- name: serves_only_one_sou_class_3_or_9c
  type: bool
  provenance: engineer_confirmed
- name: serves_only_class_4_part
  type: bool
  provenance: engineer_confirmed
- name: building_needs_24h_mv_occupancy
  type: bool
  provenance: engineer_confirmed
- name: is_carpark_exhaust
  type: bool
  provenance: engineer_confirmed
- name: required_24_7_contaminant_or_pressurisation
  type: bool
  provenance: engineer_confirmed
- name: system_type
  type: enum
  provenance: engineer_confirmed
  values:
  - air_conditioning
  - air_conditioning_heating
  - mechanical_ventilation
  - exhaust
- name: is_electricity_substation
  type: bool
  provenance: engineer_confirmed
- name: building_class
  type: string
  provenance: engineer_confirmed
  values:
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  - 7a
  - 7b
  - '8'
  - 9a
  - 9b
  - 9c
threshold:
  values:
    mv_trigger:
      value: 1000
      unit: L/s
    max_override_resume:
      value: 2
      unit: h
check: mv_airflow <= threshold('mv_trigger') or (time_switch_provided == True and time_switch_programmable_times_and_days == True and time_switch_holidays_1yr_ahead == True and time_switch_override_demand_or_manual == True and time_switch_override_resume_period <= threshold('max_override_resume'))
outcomes:
  'true': PASS
  'false': FAIL
  missing_input: NEEDS_JUDGEMENT
near_miss: 0.05
fix_hypotheses:
- 'Hypothesis: verify. Provide a 7-day programmable time switch (or BMS schedule) with public-holiday programming at least 1 year ahead.'
- 'Hypothesis: verify. Add a demand-operated or manual override that reverts to normal operation within 2 hours.'
- 'Hypothesis: verify. If the system must run 24/7 for contaminant control or pressurisation, record that basis so the J6D4(7) exemption is assessed.'
depends_on:
- systems.mv_airflow
- systems.time_switch_provided
- systems.time_switch_programmable_times_and_days
- systems.time_switch_holidays_1yr_ahead
- systems.time_switch_override_demand_or_manual
- systems.time_switch_override_resume_period
- systems.serves_only_one_sou_class_3_or_9c
- systems.serves_only_class_4_part
- project.building_needs_24h_mv_occupancy
- systems.is_carpark_exhaust
- systems.required_24_7_contaminant_or_pressurisation
- systems.system_type
- project.is_electricity_substation
- project.building_class
tests:
- name: compliant_time_switch
  inputs:
    mv_airflow: 3000
    time_switch_provided: true
    time_switch_programmable_times_and_days: true
    time_switch_holidays_1yr_ahead: true
    time_switch_override_demand_or_manual: true
    time_switch_override_resume_period: 2
    serves_only_one_sou_class_3_or_9c: false
    serves_only_class_4_part: false
    building_needs_24h_mv_occupancy: false
    is_carpark_exhaust: false
    required_24_7_contaminant_or_pressurisation: false
    system_type: mechanical_ventilation
    is_electricity_substation: false
    building_class: '5'
  expect: PASS
- name: no_time_switch_above_trigger
  inputs:
    mv_airflow: 1001
    time_switch_provided: false
    time_switch_programmable_times_and_days: false
    time_switch_holidays_1yr_ahead: false
    time_switch_override_demand_or_manual: false
    time_switch_override_resume_period: 0
    serves_only_one_sou_class_3_or_9c: false
    serves_only_class_4_part: false
    building_needs_24h_mv_occupancy: false
    is_carpark_exhaust: false
    required_24_7_contaminant_or_pressurisation: false
    system_type: mechanical_ventilation
    is_electricity_substation: false
    building_class: '5'
  expect: FAIL
- name: boundary_1000_no_switch
  inputs:
    mv_airflow: 1000
    time_switch_provided: false
    time_switch_programmable_times_and_days: false
    time_switch_holidays_1yr_ahead: false
    time_switch_override_demand_or_manual: false
    time_switch_override_resume_period: 0
    serves_only_one_sou_class_3_or_9c: false
    serves_only_class_4_part: false
    building_needs_24h_mv_occupancy: false
    is_carpark_exhaust: false
    required_24_7_contaminant_or_pressurisation: false
    system_type: mechanical_ventilation
    is_electricity_substation: false
    building_class: '5'
  expect: PASS
- name: no_holiday_programming
  inputs:
    mv_airflow: 3000
    time_switch_provided: true
    time_switch_programmable_times_and_days: true
    time_switch_holidays_1yr_ahead: false
    time_switch_override_demand_or_manual: true
    time_switch_override_resume_period: 2
    serves_only_one_sou_class_3_or_9c: false
    serves_only_class_4_part: false
    building_needs_24h_mv_occupancy: false
    is_carpark_exhaust: false
    required_24_7_contaminant_or_pressurisation: false
    system_type: mechanical_ventilation
    is_electricity_substation: false
    building_class: '5'
  expect: FAIL
- name: carpark_exhaust_exempt
  inputs:
    mv_airflow: 20000
    time_switch_provided: false
    serves_only_one_sou_class_3_or_9c: false
    serves_only_class_4_part: false
    building_needs_24h_mv_occupancy: false
    is_carpark_exhaust: true
    required_24_7_contaminant_or_pressurisation: false
    system_type: mechanical_ventilation
    is_electricity_substation: false
    building_class: '5'
  expect: NOT_APPLICABLE
- name: required_24_7_exempt
  inputs:
    mv_airflow: 5000
    time_switch_provided: false
    serves_only_one_sou_class_3_or_9c: false
    serves_only_class_4_part: false
    building_needs_24h_mv_occupancy: false
    is_carpark_exhaust: false
    required_24_7_contaminant_or_pressurisation: true
    system_type: mechanical_ventilation
    is_electricity_substation: false
    building_class: '5'
  expect: NOT_APPLICABLE
- name: class_4_part_exempt
  inputs:
    mv_airflow: 1500
    time_switch_provided: false
    serves_only_one_sou_class_3_or_9c: false
    serves_only_class_4_part: true
    building_needs_24h_mv_occupancy: false
    is_carpark_exhaust: false
    required_24_7_contaminant_or_pressurisation: false
    system_type: mechanical_ventilation
    is_electricity_substation: false
    building_class: '5'
  expect: NOT_APPLICABLE
- name: missing_airflow
  inputs:
    time_switch_provided: false
    time_switch_programmable_times_and_days: false
    time_switch_holidays_1yr_ahead: false
    time_switch_override_demand_or_manual: false
    time_switch_override_resume_period: 0
    serves_only_one_sou_class_3_or_9c: false
    serves_only_class_4_part: false
    building_needs_24h_mv_occupancy: false
    is_carpark_exhaust: false
    required_24_7_contaminant_or_pressurisation: false
    system_type: mechanical_ventilation
    is_electricity_substation: false
    building_class: '5'
  expect: NEEDS_JUDGEMENT
- name: exempt_serves_only_one_sou_class_3_or_9c_true
  inputs:
    mv_airflow: 3000
    time_switch_provided: true
    time_switch_programmable_times_and_days: true
    time_switch_holidays_1yr_ahead: true
    time_switch_override_demand_or_manual: true
    time_switch_override_resume_period: 2
    serves_only_one_sou_class_3_or_9c: true
    serves_only_class_4_part: false
    building_needs_24h_mv_occupancy: false
    is_carpark_exhaust: false
    required_24_7_contaminant_or_pressurisation: false
    system_type: mechanical_ventilation
    is_electricity_substation: false
    building_class: '5'
  expect: NOT_APPLICABLE
- name: exempt_building_needs_24h_mv_occupancy_true
  inputs:
    mv_airflow: 3000
    time_switch_provided: true
    time_switch_programmable_times_and_days: true
    time_switch_holidays_1yr_ahead: true
    time_switch_override_demand_or_manual: true
    time_switch_override_resume_period: 2
    serves_only_one_sou_class_3_or_9c: false
    serves_only_class_4_part: false
    building_needs_24h_mv_occupancy: true
    is_carpark_exhaust: false
    required_24_7_contaminant_or_pressurisation: false
    system_type: mechanical_ventilation
    is_electricity_substation: false
    building_class: '5'
  expect: NOT_APPLICABLE
- name: exempt_is_electricity_substation_true
  inputs:
    mv_airflow: 3000
    time_switch_provided: true
    time_switch_programmable_times_and_days: true
    time_switch_holidays_1yr_ahead: true
    time_switch_override_demand_or_manual: true
    time_switch_override_resume_period: 2
    serves_only_one_sou_class_3_or_9c: false
    serves_only_class_4_part: false
    building_needs_24h_mv_occupancy: false
    is_carpark_exhaust: false
    required_24_7_contaminant_or_pressurisation: false
    system_type: mechanical_ventilation
    is_electricity_substation: true
    building_class: '5'
  expect: NOT_APPLICABLE
notes: 'Encoded from ABCB NCC 2025 J6D4(4)-(7). Trigger is strictly greater than 1000 L/s. Exemptions: (6) one SOU in Class 3/9c or only a Class 4 part; (7) building needing MV for 24 h occupancy, carpark exhaust, or system required 24/7 for contaminants or pressurisation. Class 2 SOU is not listed in the 2025 (6). "Or the like" in (7)(c) needs engineer judgement on the basis.'
reviewed_by: null
reviewed_on: null
status: draft
