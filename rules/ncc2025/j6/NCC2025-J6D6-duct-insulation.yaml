    duct_type: rigid
    duct_location: other
    climate_zone: 5
    duct_in_only_or_last_room_served: false
    duct_is_conditioned_space_interface_fitting: false
    duct_is_return_air_in_conditioned_space: false
    duct_is_outdoor_or_exhaust_air: false
    duct_is_in_situ_ahu_floor: false
    duct_is_flexible_fan_connection: false
    duct_is_active_component: false
    system_type: air_conditioning
    is_electricity_substation: false
    building_class: '5'
  expect: PASS
