id: NCC2025-J6D4-exhaust-motor-stop
source:
  document: NCC 2025 Volume One
  edition: '2025'
  clause: J6D4(3)
  url: https://ncc.abcb.gov.au/editions/ncc-2025/adopted/volume-one/j-energy-efficiency/part-j6-air-conditioning-and-ventilation
applies_when:
  edition: NCC2025
  state:
  - ALL
  building_class:
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  - 7a
  - 7b
  - '8'
  - 9a
  - 9b
  - 9c
  system_type: exhaust
  exempt_when:
  - exhaust_in_sou_class_3_or_9c == True
  - is_electricity_substation == True
inputs:
- name: exhaust_airflow
  unit: L/s
  type: number
  provenance: engineer_confirmed
- name: exhaust_motor_stop_capable
  type: bool
  provenance: engineer_confirmed
- name: exhaust_in_sou_class_3_or_9c
  type: bool
  provenance: engineer_confirmed
- name: system_type
  type: enum
  provenance: engineer_confirmed
  values:
  - air_conditioning
  - air_conditioning_heating
  - mechanical_ventilation
  - exhaust
- name: is_electricity_substation
  type: bool
  provenance: engineer_confirmed
- name: building_class
  type: string
  provenance: engineer_confirmed
  values:
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  - 7a
  - 7b
  - '8'
  - 9a
  - 9b
  - 9c
threshold:
  values:
    exhaust_trigger:
      value: 1000
      unit: L/s
check: exhaust_airflow <= threshold('exhaust_trigger') or exhaust_motor_stop_capable == True
outcomes:
  'true': PASS
  'false': FAIL
  missing_input: NEEDS_JUDGEMENT
near_miss: 0.05
fix_hypotheses:
- 'Hypothesis: verify. Provide automatic control (time switch, BMS, occupancy or CO/contaminant sensing) that stops the exhaust fan motor when not needed.'
depends_on:
- systems.exhaust_airflow
- systems.exhaust_motor_stop_capable
- systems.exhaust_in_sou_class_3_or_9c
- systems.system_type
- project.is_electricity_substation
- project.building_class
tests:
- name: above_trigger_can_stop
  inputs:
    exhaust_airflow: 2500
    exhaust_motor_stop_capable: true
    exhaust_in_sou_class_3_or_9c: false
    system_type: exhaust
    is_electricity_substation: false
    building_class: '5'
  expect: PASS
- name: above_trigger_cannot_stop
  inputs:
    exhaust_airflow: 1001
    exhaust_motor_stop_capable: false
    exhaust_in_sou_class_3_or_9c: false
    system_type: exhaust
    is_electricity_substation: false
    building_class: '5'
  expect: FAIL
- name: boundary_1000_cannot_stop
  inputs:
    exhaust_airflow: 1000
    exhaust_motor_stop_capable: false
    exhaust_in_sou_class_3_or_9c: false
    system_type: exhaust
    is_electricity_substation: false
    building_class: '5'
  expect: PASS
- name: sou_class_9c_exempt
  inputs:
    exhaust_airflow: 2500
    exhaust_motor_stop_capable: false
    exhaust_in_sou_class_3_or_9c: true
    system_type: exhaust
    is_electricity_substation: false
    building_class: '5'
  expect: NOT_APPLICABLE
- name: substation_not_applicable
  inputs:
    exhaust_airflow: 2500
    exhaust_motor_stop_capable: false
    exhaust_in_sou_class_3_or_9c: false
    system_type: exhaust
    is_electricity_substation: true
    building_class: '5'
  expect: NOT_APPLICABLE
- name: missing_stop_capability
  inputs:
    exhaust_airflow: 2500
    exhaust_in_sou_class_3_or_9c: false
    system_type: exhaust
    is_electricity_substation: false
    building_class: '5'
  expect: NEEDS_JUDGEMENT
notes: Encoded from ABCB NCC 2025 J6D4(3). Trigger is strictly greater than 1000 L/s. Only exemption is an exhaust system in a SOU of a Class 3 or 9c building. J6D4(6) and (7) exemptions (incl. carpark exhaust) do not cover (3), so carpark exhaust is in scope. "When not needed" is a design judgement; engineer confirms the stop capability input.
reviewed_by: null
reviewed_on: null
status: draft
