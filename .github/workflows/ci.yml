name: ci
on:
  push:
  pull_request:
  release:
    types: [published]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: uv sync --group dev --extra agents --extra observability --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python scripts/validate_rules.py
      - run: uv run python scripts/release_gate.py --labels
      - run: uv run python scripts/release_gate.py --scan
      - run: uv run python scripts/ingest_accuracy.py --check
      - run: pnpm --filter @mep/web run typecheck
      - run: pnpm --filter @mep/web run test
      - run: uv run pytest tests/rules tests/engine tests/ingest tests/api tests/diff tests/review tests/db
      # the drafting skills: space-envelope on the locked environment, duct-fab with the CAD kernel added for this step only
      - run: uv run --with cadquery==2.8.0 --with cadquery-ocp==7.9.3.1.1 pytest tests/skills
      - run: pnpm exec supabase start && pnpm exec supabase db reset
      - run: uv run pytest tests/rls
      - run: pnpm --filter @mep/web exec playwright install --with-deps chromium
      - run: pnpm --filter @mep/web run e2e
      - run: uv run python scripts/review_db.py selftest
      - run: uv run pytest tests/golden || [ $? -eq 5 ]  # 5 = no golden projects yet
  # A release claim made any other way (a tag, a GitHub release created in the web UI) still shows up red here.
  # The three deployable images are built from a clean checkout on every push: API, web, and the isolated drafting worker (cadquery lives there).
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: docker build -f deploy/api/Dockerfile -t mep-api:ci .
      - run: docker build -f deploy/worker/Dockerfile -t mep-skill-worker:ci .
      - run: docker build -f deploy/web/Dockerfile -t mep-web:ci .
      - name: the API image starts as a non-root user and imports the app
        run: |
          test "$(docker run --rm mep-api:ci id -u)" != "0"
          docker run --rm mep-api:ci python -c "import mep.api.server, claude_agent_sdk, pypdfium2; print('api image ok')"
      - name: the web image serves
        run: |
          docker run -d --name web -p 3000:3000 mep-web:ci
          for i in $(seq 1 30); do code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true); [ "$code" = "200" ] || [ "$code" = "307" ] && break; sleep 2; done
          echo "web answered $code"; [ "$code" = "200" ] || [ "$code" = "307" ]
          docker logs web | tail -5
      - name: worker image imports its packages
        run: docker run --rm --entrypoint python mep-skill-worker:ci -c "import cadquery, ifcopenshell, ezdxf, jsonschema; print('worker image ok')"
      - name: worker image runs as non-root
        run: test "$(docker run --rm --entrypoint id mep-skill-worker:ci -u)" = "10001"
      - run: uv sync --group dev --extra agents --extra observability --locked
      - name: worker isolation probes (network, writes, non-root) in the worker image
        run: MEP_WORKER_IMAGE=mep-skill-worker:ci uv run pytest tests/skills/test_worker_isolation.py -v -rs -k "not real_worker_image"
      - name: worker builds and validates space-envelope in the worker image
        run: MEP_WORKER_IMAGE=mep-skill-worker:ci uv run pytest tests/skills/test_worker_isolation.py -v -rs -k "space_envelope"
      - name: worker builds duct-fab in the worker image
        run: MEP_WORKER_IMAGE=mep-skill-worker:ci uv run pytest tests/skills/test_worker_isolation.py -v -rs -k "duct_fab"
  release-gate:
    if: (startsWith(github.ref, 'refs/tags/') && !((startsWith(github.ref_name, 'sprint-') || startsWith(github.ref_name, 'restore-')) && !contains(github.ref_name, '.') && !contains(github.ref_name, '/'))) || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --group dev --extra agents --extra observability --locked
      - run: uv run python scripts/release_gate.py --check
  # Backstop for the local hooks: a change to a rule's sign-off or check fields needs a visible Engineer-Signoff trailer.
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --group dev --extra agents --extra observability --locked
      - run: uv run python scripts/check_signoff_changes.py --base-tag
